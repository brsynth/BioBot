<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Password — BioBot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
  <div class="auth-container">
    <h2>Set New Password</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
            <p class="flash {{ category }}">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" class="auth-form">
      <label>New Password :</label>
      <input type="password" name="password" placeholder="At least 6 characters" required minlength="6">

      <label>Confirm Password :</label>
      <input type="password" name="confirm_password" placeholder="Repeat your password" required minlength="6">

      <button type="submit" class="auth-btn">Reset Password</button>
    </form>

    <p class="auth-footer"><a href="{{ url_for('login') }}">Back to login</a></p>
  </div>
</body>
</html>
