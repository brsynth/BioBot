{% from "_brand.html" import liquid_handler %}
  <header id="app-banner" class="app-banner">
        <a class="brand" href="/?landing=1" aria-label="BioBot home">{{ liquid_handler() }}<span class="brand-title">BioBot{% if not admin_view %}<small class="brand-version">v{{ version }}</small>{% endif %}</span></a>
        <span class="version-tag">v{{ version }}</span>

        <nav id="admin-workspace-link" class="admin-workspace-link" aria-label="Workspace mode" {% if not is_admin %}hidden{% endif %}>
          <a href="/" {% if not admin_view %}aria-current="page"{% endif %}>User</a><a href="/admin" {% if admin_view %}aria-current="page"{% endif %}>Admin</a>
        </nav>
        <details id="account-menu" class="account-menu">
          <summary aria-label="User account" title="User account"><span class="count-badge" data-admin-count hidden></span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2"/></svg></summary>
          <div class="account-menu-content">
        <button id="settings-btn" class="sidebar-action-btn settings-btn" aria-label="Settings" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </button>
        <div class="appearance-control" role="group" aria-label="Appearance">
          <div class="appearance-slider">
            <span class="appearance-thumb" aria-hidden="true"></span>
            <label title="Daylight"><input type="radio" name="appearance" value="daylight" aria-label="Daylight"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></label>
            <label title="Dark"><input type="radio" name="appearance" value="dark" aria-label="Dark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13z"/></svg></label>
            <label title="Auto — follow system"><input type="radio" name="appearance" value="auto" aria-label="Auto"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4m-4 0h8"/></svg></label>
          </div>
        </div>
        <a id="admin-btn" href="/admin" {% if not is_admin %}hidden{% endif %} class="sidebar-action-btn settings-btn" aria-label="Administration" title="Administration"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="m9 12 2 2 4-4"/></svg><span class="count-badge" data-admin-count hidden></span></a>
        <button id="logout-btn" class="sidebar-action-btn logout-btn" aria-label="Log out" title="Log out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Log out
        </button>
          </div>
        </details>
        {% if not admin_view %}
        <button id="sidebar-toggle" class="landing-history-toggle" type="button" aria-label="History and saved protocols" title="History and saved protocols" aria-expanded="false" aria-controls="sidebar">
          <span id="history-unread-count" class="history-unread-count" aria-hidden="true" hidden></span>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 7.4M3 4v7h7"/><path d="M12 7v5l3 2"/></svg>
        </button>
        {% endif %}
  </header>
