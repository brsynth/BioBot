services:
  biobot:
    build: .
    image: biobot:latest
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./biobot/docs:/app/docs
      - ./biobot/handlers.json:/app/handlers.json
      - ./biobot:/app:rw
      - app_data:/app/data
    env_file :
      - path: .env
        required: false
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-biobotdb}
      - DB_USER=${DB_USER:-biobotuser}
      - DB_PASSWORD=${DB_PASSWORD:-biobotpass}
      - API_KEY=${API_KEY:-}
    restart : always
    depends_on:
      - postgres
    networks:
      - db
      - biobot


  postgres:
    image: postgres:16
    env_file :
      - path: .env
        required: false
    environment:
      - POSTGRES_DB=${DB_NAME:-biobotdb}
      - POSTGRES_USER=${DB_USER:-biobotuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-biobotpass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db

volumes:
  db_data:
  app_data:

networks:
  db:
  biobot:
    name: biobot
